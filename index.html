
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>My Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #101014;
      --card: #1b1b23;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #e02be8;
      --border: #30303b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: max(22px, env(safe-area-inset-top)) 16px 28px;
      min-height: 100vh;
      background: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
      font-family: system-ui, sans-serif;
    }

    .app {
      max-width: 480px;
      margin: auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--accent);
      color: white;
      font-size: 23px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 18px;
    }

    .muted {
      color: var(--tg-theme-hint-color, var(--muted));
      font-size: 13px;
      margin-top: 4px;
    }

    .hero {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(ellipse at top right, #e02be822, transparent 60%),
        var(--card);
    }

    .label {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 28px;
      margin: 12px 0;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 49px;
      margin-top: 10px;
      border: none;
      border-radius: 13px;
      padding: 13px;
      background: var(--tg-theme-button-color, var(--accent));
      color: var(--tg-theme-button-text-color, white);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #292934;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .section-title {
      margin: 24px 2px 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tile {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
    }

    .tile-icon {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .tile strong {
      font-size: 14px;
    }

    .tile p {
      font-size: 12px;
      margin-bottom: 0;
    }

    #toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #292934;
      color: white;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <div class="logo">M</div>
      <div>
        <h1>MY MINI APP</h1>
        <div class="muted" id="status">Веб-приложение</div>
      </div>
    </header>

    <section class="hero">
      <div class="label">WELCOME</div>

      <h2 id="welcome">Добро пожаловать</h2>

      <p>
        Твоё приложение внутри Telegram.
        Здесь можно разместить любые функции,
        кнопки и разделы.
      </p>

      <button id="mainButton">
        Основное действие
      </button>

      <button class="secondary" id="profileButton">
        Мой профиль
      </button>
    </section>

    <div class="section-title">Быстрый доступ</div>

    <section class="grid">
      <div class="tile">
        <div class="tile-icon">⚡</div>
        <strong>Быстро</strong>
        <p>Минимум кода и зависимостей.</p>
      </div>

      <div class="tile">
        <div class="tile-icon">🎨</div>
        <strong>Удобно</strong>
        <p>Интерфейс для смартфонов.</p>
      </div>
    </section>

    <p class="muted" id="info">
      Версия 1.0 · Готово к настройке
    </p>

  </main>

  <div id="toast" role="status"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    const toast = document.getElementById("toast");

    let toastTimer;

    function notify(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;

      if (user?.first_name) {
        document.getElementById("welcome").textContent =
          "Привет, " + user.first_name;
      }

      document.getElementById("status").textContent =
        "Telegram Mini App";

      document.getElementById("info").textContent =
        "Запущено внутри Telegram";
    }

    document.getElementById("mainButton")
      .addEventListener("click", () => {
        notify("Основная кнопка работает!");

        tg?.HapticFeedback?.impactOccurred("light");
      });

    document.getElementById("profileButton")
      .addEventListener("click", () => {
        if (tg) {
          const user = tg.initDataUnsafe?.user;

          if (user) {
            notify("Твой Telegram ID: " + user.id);
          } else {
            notify("Информация профиля недоступна");
          }
        } else {
          notify("Открой приложение в Telegram");
        }
      });
  </script>
</body>
</html>
